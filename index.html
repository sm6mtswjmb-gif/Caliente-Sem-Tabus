<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#220b16"><title>CALIENTE — Sem Tabus</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#61203c 0%,#210b17 65%,#120810);color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}main{max-width:540px;margin:auto;padding:32px 18px 55px}header{text-align:center}h1{font-size:36px;margin:0;color:#ff7b9b;letter-spacing:2px}p{color:#e8bacb}.subtitle{margin:4px 0 25px}select,button{font:inherit;min-height:54px;border:0;border-radius:15px;color:#fff}select{width:100%;background:#543044;padding:0 16px}button{cursor:pointer;font-weight:700;padding:12px 16px;background:#ee527c;touch-action:manipulation}button:active{transform:scale(.98)}.stage{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 9px;color:#ffb3c7;font-size:14px}.bar{height:7px;border-radius:20px;background:#543044;overflow:hidden}.fill{height:100%;width:20%;background:linear-gradient(90deg,#f66b8e,#ffad65);transition:width .3s}.card{margin:19px 0;background:linear-gradient(145deg,#582039,#371426);border:1px solid #aa526c;border-radius:25px;min-height:280px;box-shadow:0 18px 38px #0007;padding:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.card small{color:#ffafc6;letter-spacing:2px}.card h2{font-size:clamp(22px,5vw,29px);line-height:1.35;font-weight:650}.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px}.pass{background:#744057}.next{margin-top:12px;width:100%;background:#b52e5b}.msg{text-align:center;min-height:24px;font-size:15px}.fine{text-align:center;font-size:13px;line-height:1.5;color:#d6a8b8}.counter{text-align:center;font-size:13px;color:#f2b6ca}</style></head><body><main><header><h1>🔥 CALIENTE</h1><p class="subtitle">Sem Tabus · Versão de teste · 18+</p></header><label for="mode">Escolhe a edição</label><select id="mode"><option value="casal">❤️ Só Nós Dois</option><option value="grupo">🔥 Festa Sem Tabus</option></select><div class="stage"><span id="stage">✨ Aquecimento</span><span id="level">Nível 1/5</span></div><div class="bar"><div class="fill" id="fill"></div></div><section class="card"><small id="cardno">CARTA 1</small><h2 id="question"></h2></section><div class="actions"><button id="accept" type="button">✓ Aceitar</button><button id="pass" class="pass" type="button">🥃 Passar / Shot</button></div><button id="next" class="next" type="button">Próxima carta →</button><p id="message" class="msg" aria-live="polite"></p><p id="counter" class="counter"></p><p class="fine">Qualquer carta pode ser passada sem penalização. O shot é opcional e pode ser sem álcool. Respeita sempre os limites e o consentimento de todos.</p></main><script>
'use strict';
const decks={casal:[['Qual foi o momento em que sentiste mais química entre nós?','O que mais gostas no nosso sentido de humor?','Que encontro nosso gostarias de repetir?','Qual foi a primeira coisa em mim que te atraiu?'],['Que tipo de beijo te deixa mais arrepiado?','Qual é o meu gesto mais sedutor?','Que música escolherias para uma noite romântica?','Qual seria a tua surpresa ideal para esta noite?'],['Que fantasia íntima gostarias de me contar?','Há alguma novidade que gostasses de experimentar a dois?','O que te faz sentir mais desejado?','Que tipo de ambiente te ajuda a descontrair na intimidade?'],['Que desejo nunca tiveste coragem de partilhar comigo?','Que aventura romântica fora da rotina gostarias de viver?','Que limites são importantes para ti numa experiência nova?','Que pergunta íntima gostarias que eu te fizesse?'],['Se pudesses planear uma noite sem interrupções, como seria?','Que fantasia gostarias de explorar primeiro numa conversa?','O que gostarias que fizéssemos mais vezes a dois?','Qual é a tua forma preferida de demonstrar desejo?']],grupo:[['Qual foi o encontro mais divertido que tiveste?','Qual é a característica mais atraente numa pessoa?','Qual foi a tua pior frase de engate?','Que celebridade achas mais sedutora?'],['Qual foi o beijo mais inesquecível da tua vida?','Já tiveste uma paixão secreta?','Qual é o teu sinal de interesse mais óbvio?','Que tipo de encontro te parece mais provocador?'],['Qual é a tua opinião sobre aventuras de uma noite?','Já tiveste atração por alguém inesperado?','Que fantasia gostarias de discutir com um parceiro?','Qual é a maior surpresa romântica que já preparaste?'],['O que pensas sobre relações abertas, quando há acordo mútuo?','Qual foi a situação de maior tensão romântica que viveste?','Que limite consideras essencial num jogo de adultos?','Já mudaste de opinião sobre alguma fantasia?'],['Se não houvesse julgamentos, que pergunta íntima farias ao grupo?','Que tipo de aventura consentida tens curiosidade em conhecer melhor?','Que experiência romântica te marcou mais?','O que é indispensável para te sentires confortável numa situação ousada?']]};
let mode='casal',round=0;const el=id=>document.getElementById(id);function render(){const level=Math.min(4,Math.floor(round/4)),index=round%4;el('stage').textContent=['✨ Aquecimento','💗 Sedução','🔥 Fantasias','🌶️ Sem Tabus','❤️‍🔥 Intensidade Máxima'][level];el('level').textContent='Nível '+(level+1)+'/5';el('fill').style.width=((level+1)*20)+'%';el('cardno').textContent='CARTA '+(round+1);el('question').textContent=decks[mode][level][index];el('message').textContent='';el('counter').textContent='Carta '+(round+1)+' de 20 · Demonstração'}el('mode').addEventListener('change',e=>{mode=e.target.value;round=0;render()});el('accept').addEventListener('click',()=>{el('message').textContent='Carta aceite! Quando quiserem, avancem.'});el('pass').addEventListener('click',()=>{el('message').textContent='Carta passada! Shot opcional, com ou sem álcool, ou simplesmente avancem.'});el('next').addEventListener('click',()=>{round=(round+1)%20;render()});render();
</script></body></html>
